<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>New Contact Message</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0f172a;
        /* Dark Background */
        color: #d1d5db;
        /* Light Text */
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #1e293b;
        /* Card Background */
        border-radius: 16px;
        border: 1px solid #334155;
        overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      }

      .header {
        background-color: #0f172a;
        /* Navy Background - Requested by User */
        padding: 30px;
        text-align: center;
        border-bottom: 2px solid #22d3ee;
        /* Cyan Accent Border */
      }

      .header h1 {
        color: #ffffff;
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .content {
        padding: 30px;
      }

      .field {
        margin-bottom: 20px;
        border-bottom: 1px solid #334155;
        padding-bottom: 15px;
      }

      .field:last-child {
        border-bottom: none;
      }

      .label {
        font-size: 12px;
        text-transform: uppercase;
        color: #94a3b8;
        /* Muted Text */
        margin-bottom: 6px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .value {
        font-size: 16px;
        color: #f1f5f9;
        /* White-ish Text */
        line-height: 1.5;
      }

      .footer {
        background-color: #0f172a;
        padding: 20px;
        text-align: center;
        font-size: 12px;
        color: #64748b;
        border-top: 1px solid #334155;
      }

      .icon {
        color: #38bdf8;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>New Message from your Website</h1>
      </div>

      <!-- Content -->
      <div class="content">
        <!-- Name -->
        <div class="field">
          <div class="label"><span>👤</span> From</div>
          <div class="value">{{NAME}}</div>
        </div>

        <!-- Email -->
        <div class="field">
          <div class="label"><span>📧</span> Email</div>
          <div class="value">
            <a href="mailto:{{EMAIL}}" style="color: #38bdf8; text-decoration: none">{{EMAIL}}</a>
          </div>
        </div>

        <!-- Subject -->
        <div class="field">
          <div class="label"><span>📑</span> Subject</div>
          <div class="value">{{SUBJECT}}</div>
        </div>

        <!-- Message -->
        <div class="field">
          <div class="label"><span>💬</span> Message</div>
          <div
            class="value"
            style="
              background: #0f172a;
              padding: 15px;
              border-radius: 8px;
              border: 1px solid #334155;
              text-align: justify;
            "
          >
            {{MESSAGE}}
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">Sent securely from felipemiramontesr.net • {{DATE}}</div>
    </div>
  </body>
</html>
