<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Thank You for Contacting Me</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #0f172a;
        /* Dark Background */
        color: #d1d5db;
        /* Light Text */
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        background-color: #1e293b;
        /* Card Background */
        border-radius: 16px;
        border: 1px solid #334155;
        overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      }

      .header {
        background-color: #0f172a;
        /* Navy Background */
        padding: 30px;
        text-align: center;
        border-bottom: 2px solid #22d3ee;
        /* Cyan Accent */
      }

      .header h1 {
        color: #ffffff;
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .content {
        padding: 30px;
      }

      .message-body {
        background: #0f172a;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #334155;
        text-align: justify;
        color: #f1f5f9;
        font-size: 16px;
        line-height: 1.6;
      }

      .footer {
        background-color: #0f172a;
        padding: 20px;
        text-align: center;
        font-size: 12px;
        color: #64748b;
        border-top: 1px solid #334155;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <h1>Thank you for reaching out!</h1>
      </div>

      <!-- Content -->
      <div class="content">
        <div class="message-body">
          <p>I have received your message regarding <strong>"{{SUBJECT}}"</strong>.</p>

          <p>
            I appreciate your interest. I will review your inquiry and get back to you as soon as
            possible.
          </p>

          <br />
          <p>Best regards,</p>
          <p style="color: #22d3ee; font-weight: 700; margin-top: 5px">
            B. Eng. Felipe de Jesús Miramontes Romero
          </p>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">Sent securely from felipemiramontesr.net • {{DATE}}</div>
    </div>
  </body>
</html>
