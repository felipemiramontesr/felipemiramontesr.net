name: FTP Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality-check:
    name: 🛡️ Quality & Build Check
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔓 Fix Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint Code
        run: npm run lint

      - name: 💅 Check Formatting
        run: npm run format:check

      - name: 🏗️ Validate HTML
        run: npm run validate

      - name: 🧪 Run Unit & Integrity Tests
        run: npm test

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🚦 Run Functional E2E Tests (Strict)
        # MUST PASS: Checks logic (Cookies, Buttons, Links)
        run: npx playwright test tests/e2e/cookies.spec.js

      - name: 🎨 Run Visual E2E Tests (Experimental)
        # ALLOW FAIL: Checks pixels (Fonts often differ on Linux vs Windows)
        continue-on-error: true
        run: npx playwright test tests/e2e/visual.spec.js

      - name: 🏗️ Build Production (Dry Run)
        run: npm run build

  deploy:
    name: 🚀 Deploy to Production
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Production
        run: npm run build

      - name: 📂 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          log-level: verbose
          timeout: 600000
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ./
